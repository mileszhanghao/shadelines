name: Build and publish

# Rebuilds the analysis from the raw-data snapshot and publishes the map.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Fetch raw data]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Get the raw-data snapshot
        run: |
          git fetch --depth 1 origin raw-data:refs/remotes/origin/raw-data
          mkdir -p data/raw
          git archive origin/raw-data | tar -x -C data/raw
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Build
        run: |
          python -m shadelines.build
          python -m shadelines.figures
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
